appId: com.ripperclipper.app
productName: Ripper Clipper
copyright: Ripper Clipper

directories:
  output: release
  buildResources: build

icon: build/icon.png

files:
  - out/**
  - package.json

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
      - '!README.md'
  - from: resources/icon.png
    to: icon.png

asar: true

fileAssociations:
  - ext: cookieclip
    name: Ripper Clipper project
    description: Ripper Clipper project
    role: Editor

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ripper Clipper

linux:
  target:
    - AppImage
  category: AudioVideo

mac:
  target:
    - dmg
  category: public.app-category.video
